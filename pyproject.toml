[project]
name = "blent-assistant-service-client"
version = "0.1.0"
description = "Assistant de chat service client e-commerce (LangChain, LLM open-weights, SQLite)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langchain>=1.4.9",
    "langchain-ollama>=1.1.0",
    "python-dotenv>=1.2.4",
    "streamlit>=1.67.0",
]

[dependency-groups]
dev = [
    "black>=26.10.0",
    "flake8>=7.4.1",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
]

[tool.black]
target-version = ["py311"]
